name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22 # <-- Auf stabile Node-Version 22 (LTS) angehoben!
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ==========================================
      # DEPLOYMENT FÜR DEN DEV-BRANCH (Staging)
      # ==========================================
      - name: Build for Dev (Staging) 🧪
        if: github.ref == 'refs/heads/dev'
        # Setzt den Pfad auf /oo-workflow-tracer/dev/
        run: |
          export VITE_BASE_PATH=/oo-workflow-tracer/dev/
          npm run build

      - name: Deploy Dev to Subfolder 🚀
        if: github.ref == 'refs/heads/dev'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: dev # Schreibt den Build in den Unterordner /dev
          clean-exclude: |
            !dev/

      # ==========================================
      # DEPLOYMENT FÜR DEN MAIN-BRANCH (Production)
      # ==========================================
      - name: Build for Production 🏆
        if: github.ref == 'refs/heads/main'
        # Setzt den Pfad auf den Hauptordner /oo-workflow-tracer/
        run: |
          export VITE_BASE_PATH=/oo-workflow-tracer/
          npm run build

      - name: Deploy Production to Root 🚀
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: . # Schreibt den Build direkt ins Hauptverzeichnis
          clean-exclude: |
            dev/ # Verhindert, dass der /dev-Ordner gelöscht wird
